# T1 layer 2: differential run of tests/psql (scenarios + DSQL-rule probes)
# against micro-dsql (target A) and the MiniStack DSQL emulator (target B).
# Report-only: this job is allowed to fail and never blocks a merge.
name: differential

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  differential:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install psql (PostgreSQL 16 client)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          psql --version

      - name: Install build dependencies (libclang for pg_query)
        run: sudo apt-get install -y clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build micro-dsql
        run: cargo build --release -p micro-dsql

      - name: Start micro-dsql if a binary is available
        run: |
          bin=""
          for c in target/release/micro-dsql target/debug/micro-dsql; do
            [ -x "$c" ] && bin=$c && break
          done
          if [ -n "$bin" ]; then
            "$bin" --listen 127.0.0.1:15432 > micro-dsql.log 2>&1 &
            for i in $(seq 1 20); do
              PGHOST=127.0.0.1 PGPORT=15432 PGUSER=admin PGDATABASE=postgres \
                PGPASSWORD=anything PGSSLMODE=disable psql -X -At -c 'SELECT 1' && break
              sleep 0.5
            done
          else
            echo "micro-dsql binary not available; target A will be reported as unreachable"
          fi

      - name: Start MiniStack reference (DSQL_STRICT=1)
        run: scripts/ministack-up.sh > ministack.env

      - name: Compare micro-dsql (A) with MiniStack (B)
        run: |
          printf 'NAME=micro-dsql\nPGHOST=127.0.0.1\nPGPORT=15432\n' > micro-dsql.env
          scripts/compare.sh --a micro-dsql.env --b ministack.env
          cat reports/diff-*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Layer 1 against the reference must stay green
        run: |
          . ./ministack.env
          tests/psql/run.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: |
            reports/
            micro-dsql.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: scripts/ministack-down.sh
