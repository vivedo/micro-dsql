# Gates from the constitution (Principle IV): fmt, clippy, tests, and the T1 layer-1
# psql scenarios against a running micro-dsql. Blocking, on macOS and Linux.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # pg_query's bindgen needs libclang; psql runs the T1 scenarios.
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev postgresql-client
          psql --version

      # The Xcode command line tools on the runner provide clang/libclang.
      - name: Install psql (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: T1 layer 1 (tests/psql) against micro-dsql
        env:
          PGHOST: 127.0.0.1
          PGPORT: "15432"
          PGUSER: admin
          PGDATABASE: postgres
          PGPASSWORD: anything
          PGSSLMODE: disable
        run: |
          cargo build -p micro-dsql
          target/debug/micro-dsql --listen 127.0.0.1:15432 > micro-dsql.log 2>&1 &
          echo $! > micro-dsql.pid
          for i in $(seq 1 50); do
            grep -q "listening on" micro-dsql.log && break
            sleep 0.2
          done
          cat micro-dsql.log
          tests/psql/run.sh
          kill -TERM "$(cat micro-dsql.pid)"

      - name: Upload micro-dsql log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: micro-dsql-log-${{ matrix.os }}
          path: micro-dsql.log
          if-no-files-found: ignore
